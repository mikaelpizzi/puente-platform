name: CI - Health Check

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # 👇 Generate Prisma Client before linting (types are generated dynamically)
      - name: Generate Prisma Client
        run: |
          cd apps/backend/finance-service && npx prisma generate
          cd ../auth-service && npx prisma generate

      - name: Lint Check
        run: pnpm lint

      - name: Build Check (Frontend PWA)
        run: pnpm --filter ./apps/frontend/pwa run build
