name: CI - Health Check

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 👇 Install pnpm FIRST (required for Node.js cache to work)
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      # 👇 Now setup Node (it will find pnpm for caching)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Generate Prisma Client (required for TypeScript types)
      - name: Generate Prisma Client
        run: |
          if [ -d "apps/backend/finance-service" ]; then cd apps/backend/finance-service && npx prisma generate && cd ../../..; fi
          if [ -d "apps/backend/auth-service" ]; then cd apps/backend/auth-service && npx prisma generate && cd ../../..; fi

      - name: Lint Check
        run: pnpm lint

      - name: Build Check (Frontend PWA)
        run: pnpm --filter ./apps/frontend/pwa run build
