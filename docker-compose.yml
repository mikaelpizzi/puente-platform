version: '3.9'

x-otel-env: &otel-env # Reuse this block in backend service containers to forward traces locally.
  OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-https://otlp-gateway-prod-us-east-2.grafana.net/otlp}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-Authorization=Basic <grafana-basic-token>}
  OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-my-application-group}
  OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-development}
  OTEL_NODE_RESOURCE_DETECTORS: ${OTEL_NODE_RESOURCE_DETECTORS:-env,host,os}

services:
  postgres:
    image: postgres:16-alpine
    container_name: puente-dev-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      <<: *otel-env
      POSTGRES_USER: ${POSTGRES_USER:-puente}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-puente}
      POSTGRES_DB: ${POSTGRES_DB:-puente}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-puente} -d ${POSTGRES_DB:-puente}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - puente-dev

  mongo:
    image: mongo:6
    container_name: puente-dev-mongo
    restart: unless-stopped
    ports:
      - '${MONGO_PORT:-27017}:27017'
    environment:
      <<: *otel-env
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-puente}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-puente}
    volumes:
      - mongo_data:/data/db
    networks:
      - puente-dev

  redis:
    image: redis:7-alpine
    container_name: puente-dev-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: redis-server --save "" --appendonly no
    environment:
      <<: *otel-env
    networks:
      - puente-dev
    volumes:
      - redis_data:/data

  # OSRM Routing Service - Task 45
  osrm:
    image: osrm/osrm-backend
    container_name: puente-dev-osrm
    restart: unless-stopped
    ports:
      - '${OSRM_PORT:-5000}:5000'
    volumes:
      - ./docker/osrm/data:/data
    command: 'osrm-routed --algorithm mld /data/venezuela-latest.osrm'
    networks:
      - puente-dev
    profiles:
      - routing # Optional: only start when needed with --profile routing

  # MailHog Email Testing - Task 44
  mailhog:
    image: mailhog/mailhog
    container_name: puente-dev-mailhog
    restart: unless-stopped
    ports:
      - '${MAILHOG_SMTP_PORT:-1025}:1025' # SMTP for backend
      - '${MAILHOG_WEB_PORT:-8025}:8025' # Web UI for testing
    networks:
      - puente-dev

  # Meilisearch - Task 63 (Optional search engine)
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: puente-dev-meilisearch
    restart: unless-stopped
    ports:
      - '${MEILISEARCH_PORT:-7700}:7700'
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-masterKey}
      MEILI_NO_ANALYTICS: 'true'
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - puente-dev

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  meilisearch_data:

networks:
  puente-dev:
    driver: bridge
