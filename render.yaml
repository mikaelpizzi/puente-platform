services:
  # 1. API GATEWAY
  - type: web
    name: puente-gateway
    env: docker
    dockerContext: .
    dockerfilePath: apps/backend/api-gateway/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: '3000'
      - key: NODE_ENV
        value: 'production'
      # JWT Secret for auth verification
      - key: AUTH_JWT_ACCESS_SECRET
        sync: false
      # Service URLs - configure after all services are deployed
      - key: AUTH_SERVICE_URL
        sync: false
      - key: PRODUCTS_SERVICE_URL
        sync: false
      - key: FINANCE_SERVICE_URL
        sync: false
      - key: LOGISTICS_SERVICE_URL
        sync: false
      # Disable OpenTelemetry by default (can enable later)
      - key: OTEL_SDK_DISABLED
        value: 'true'

  # 2. AUTH SERVICE
  - type: web
    name: puente-auth
    env: docker
    dockerContext: .
    dockerfilePath: apps/backend/auth-service/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: '3001'
      - key: NODE_ENV
        value: 'production'
      # Prisma uses AUTH_DATABASE_URL (see schema.prisma)
      - key: AUTH_DATABASE_URL
        sync: false

  # 3. PRODUCTS SERVICE
  - type: web
    name: puente-products
    env: docker
    dockerContext: .
    dockerfilePath: apps/backend/products-service/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: '3002'
      - key: NODE_ENV
        value: 'production'
      - key: MEILISEARCH_HOST
        sync: false
      - key: MEILISEARCH_API_KEY
        sync: false

  # 4. FINANCE SERVICE
  - type: web
    name: puente-finance
    env: docker
    dockerContext: .
    dockerfilePath: apps/backend/finance-service/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: '3003'
      - key: NODE_ENV
        value: 'production'
      # Prisma uses FINANCE_DATABASE_URL (see schema.prisma)
      - key: FINANCE_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

  # 5. LOGISTICS SERVICE
  - type: web
    name: puente-logistics
    env: docker
    dockerContext: .
    dockerfilePath: apps/backend/logistics-service/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: '3004'
      - key: NODE_ENV
        value: 'production'
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OSRM_API_URL
        sync: false

  # 6. NOTIFICATION SERVICE
  - type: web
    name: puente-notifications
    env: docker
    dockerContext: .
    dockerfilePath: apps/backend/notification-service/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: '3005'
      - key: NODE_ENV
        value: 'production'
      - key: REDIS_URL
        sync: false
      - key: MAIL_HOST
        value: 'smtp.resend.com'
      - key: MAIL_PORT
        value: '465'
      - key: MAIL_USER
        value: 'resend'
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
